<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠지 관리자</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>KUJI ADMIN</b><button class="b g hide" id="out">로그아웃</button></header>
<main>
<div class="card" id="login"><h2>관리자 로그인</h2><div class="f"><input id="em" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button class="b" id="go">로그인</button></div><div class="warn" id="err"></div></div>
<div class="hide" id="panel">
<div class="card"><h2>판 설정</h2>
<div class="f"><label>총 티켓 수<input id="total" type="number" min="1" value="50"></label>
<label>1회 뽑기 비용(코인)<input id="price" type="number" min="0" value="100"></label>
<label>라스트원상 보너스(코인)<input id="lastr" type="number" min="0" value="3000"></label></div>
<h2>등급 (코드 / 이름 / 수량 / 코인)</h2><div id="rows"></div>
<button class="b g" id="add">등급 추가</button>
<p id="sum"></p><label><input type="checkbox" id="clr" style="width:auto" checked> 로그(history)도 초기화</label><br><br>
<button class="b r" id="start">새 판 시작 / 리셋</button> <span id="msg"></span></div>
<div class="card"><h2>실시간 결과 로그 (최근 100건)</h2><div style="overflow:auto"><table><thead><tr><th>시간</th><th>유저</th><th>티켓</th><th>등급</th><th>코인</th></tr></thead><tbody id="log"></tbody></table></div></div>
</div></main>
<script type="module">
import { db, auth } from "./firebase-config.js";
import { ref, set, remove, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $ = id => document.getElementById(id);
$("go").onclick = () => signInWithEmailAndPassword(auth, $("em").value, $("pw").value).catch(e => $("err").textContent = e.message);
$("out").onclick = () => signOut(auth);
let unsub = null;
onAuthStateChanged(auth, u => {
  $("login").classList.toggle("hide", !!u); $("panel").classList.toggle("hide", !u); $("out").classList.toggle("hide", !u);
  if (u && !unsub) {
    unsub = onValue(query(ref(db, "history"), limitToLast(100)), s => {
      const tb = $("log"); tb.textContent = ""; const a = [];
      s.forEach(c => { a.push(c.val()); });
      a.reverse().forEach(h => { const tr = tb.insertRow();
        [new Date(h.timestamp).toLocaleString(), h.userName, h.ticketId, h.rank, h.reward].forEach(v => { tr.insertCell().textContent = v; }); });
    });
  }
});
function addRow(r = "", n = "", c = 1, w = 0) {
  const d = document.createElement("div"); d.className = "g4";
  d.innerHTML = '<input class="r" placeholder="A"><input class="n" placeholder="A상"><input class="c" type="number" min="0"><input class="w" type="number" min="0"><button class="b g">삭제</button>';
  d.querySelector(".r").value = r; d.querySelector(".n").value = n; d.querySelector(".c").value = c; d.querySelector(".w").value = w;
  d.querySelector("button").onclick = () => { d.remove(); sum(); }; d.oninput = sum; $("rows").append(d); sum();
}
function prizes() { return [...$("rows").children].map(d => ({ rank: d.querySelector(".r").value.trim(), name: d.querySelector(".n").value.trim(), count: +d.querySelector(".c").value, reward: +d.querySelector(".w").value })); }
function sum() {
  const s = prizes().reduce((a, p) => a + p.count, 0), t = +$("total").value, ok = s === t;
  $("sum").textContent = "등급 수량 합계 " + s + " / 총 티켓 " + t + (ok ? " (일치)" : " (불일치: 시작할 수 없습니다)");
  $("sum").className = ok ? "okc" : "warn"; return ok;
}
$("total").oninput = sum; $("add").onclick = () => addRow();
[["A", "A상", 1, 8000], ["B", "B상", 2, 3000], ["C", "C상", 5, 1000], ["D", "D상", 12, 300], ["E", "E상", 30, 90]].forEach(a => addRow(...a));
$("start").onclick = async () => {
  const ps = prizes();
  if (!sum()) return alert("총 티켓 수와 등급별 수량 합계가 다릅니다.");
  if (ps.some(p => !p.rank || !p.name) || new Set(ps.map(p => p.rank)).size !== ps.length) return alert("등급 코드/이름을 확인하세요 (코드 중복 불가).");
  if (!confirm("현재 판을 지우고 새 판을 시작합니다.")) return;
  const pool = []; ps.forEach(p => { for (let i = 0; i < p.count; i++) pool.push(p); });
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const tickets = {}; pool.forEach((p, i) => { tickets[i + 1] = { id: i + 1, opened: false, openedBy: null, rank: p.rank, reward: p.reward }; });
  try {
    if ($("clr").checked) await remove(ref(db, "history"));
    await set(ref(db, "current_board"), { status: "active", total_tickets: pool.length, remaining: pool.length, price_per_ticket: +$("price").value, last_one_reward: +$("lastr").value, prizes: ps, tickets });
    $("msg").textContent = "새 판이 시작되었습니다.";
  } catch (e) { $("msg").textContent = "실패: " + e.message; }
};
</script></body></html>
